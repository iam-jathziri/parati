<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: 'Great Vibes', cursive;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    .title {
      font-size: 50px;
      color: #fff;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-shadow:
        0 0 10px rgba(255, 100, 150, 0.9),
        0 0 25px rgba(255, 100, 150, 0.6);
    }

    .title::after {
      content: "|";
      margin-left: 5px;
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      50%,
      100% {
        opacity: 1;
      }

      25%,
      75% {
        opacity: 0;
      }
    }

    .message {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: rgba(255, 150, 180, 0.7);
      font-size: 30px;
      letter-spacing: 3px;
      animation: pulse 3s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>
  <div class="title" id="title"></div>
  <div class="message">❤ Eres todo para mi ❤</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = W * dpr;
      canvas.height = H * dpr;

      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resizeCanvas();

    const COLORS = [
      { h: 306, s: 83, l: 50 },
      { h: 291, s: 58, l: 42 },
      { h: 225, s: 100, l: 52 },
      { h: 356, s: 100, l: 52 },
      { h: 33,  s: 91, l: 53 },
      { h: 130, s: 64, l: 48 },
    ];

    function randColor() {
      const c = COLORS[Math.floor(Math.random() * COLORS.length)];
      const l = c.l + (Math.random() - 0.5) * 20;
      return `hsl(${c.h}, ${c.s}%, ${l}%)`;
    }

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const TOTAL_POINTS = 400;
    let heartPoints = [];

    function buildHeartPoints() {
      const cx = W / 2;
      const cy = H / 2;
      const scale = (Math.min(W, H) - 20) / 35;

      heartPoints = [];
      for (let i = 0; i < TOTAL_POINTS; i++) {
        const t = (i / TOTAL_POINTS) * Math.PI * 2;
        const { x, y } = heartPoint(t);
        heartPoints.push({ x: cx + x * scale, y: cy + y * scale });
      }
    }

    buildHeartPoints();

    class Particle {
      constructor(target, delay) {
        const cx = W / 2, cy = H / 2;
        this.x = cx + (Math.random() - 0.5) * 60;
        this.y = cy + (Math.random() - 0.5) * 60;
        this.tx = target.x;
        this.ty = target.y;

        this.vx = 0;
        this.vy = 0;
        this.radius = Math.random() * 1.8 + 0.8;
        this.color = randColor();
        this.delay = delay;
        this.alpha = 0;

        this.phase = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 0.02 + 0.01;
      }

      update(frame) {
        if (frame < this.delay) return;

        const dx = this.tx - this.x;
        const dy = this.ty - this.y;

        this.vx += dx * 0.06;
        this.vy += dy * 0.06;

        this.vx *= 0.88;
        this.vy *= 0.88;

        this.x += this.vx;
        this.y += this.vy;

        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
          this.alpha = 0.7 + 0.3 * Math.sin(this.phase);
          this.phase += this.speed;
        } else {
          this.alpha = Math.min(this.alpha + 0.05, 1);
        }
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let bgParticles = [];

    class BgParticle {
      constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.radius = Math.random() * 1.5 + 0.3;
        this.speed = Math.random() * 0.5 + 0.2;
        this.alpha = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.y -= this.speed;
        if (this.y < 0) {
          this.y = H;
          this.x = Math.random() * W;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];
    let frame = 0;

    function spawnParticles() {
      particles = [];
      heartPoints.forEach((pt, i) => {
        const delay = Math.floor((i / TOTAL_POINTS) * 80);
        particles.push(new Particle(pt, delay));
      });
    }

    spawnParticles();

    for (let i = 0; i < 120; i++) {
      bgParticles.push(new BgParticle());
    }

    function animate() {
      requestAnimationFrame(animate);

      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, 0, W, H);

      frame++;

      bgParticles.forEach(p => {
        p.update();
        p.draw();
      });

      particles.forEach(p => {
        p.update(frame);
        p.draw();
      });
    }

    animate();

    window.addEventListener('resize', () => {
      resizeCanvas();
      buildHeartPoints();
      spawnParticles();
      frame = 0;
    });

    const text = "Te amo";
    const titleEl = document.getElementById("title");

    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        titleEl.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 150);
      }
    }

    setTimeout(typeWriter, 800);

  </script>

</body>

</html>
